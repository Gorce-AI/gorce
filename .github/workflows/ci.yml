name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  bun-task-6:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Verify technology baseline
        run: bun run verify:technology -- --bun=1.3.14 --typescript=6.0.3 --strict
      - name: Verify architecture rules
        run: bun run verify:architecture -- --strict
      - name: Run Biome lint
        run: bun run lint
      - name: Run TypeScript typecheck
        run: bun run typecheck
      - name: Prepare Task 6 evidence directory
        run: mkdir -p "$RUNNER_TEMP/gorce-evidence"
      - name: Hash canonical architecture rules
        run: |
          bun run architecture:hash-rules -- \
            --technology=architecture/typescript-bun-baseline.v1.yaml \
            --studio=architecture/studio-host-gate.v1.yaml \
            --evidence="$RUNNER_TEMP/gorce-evidence/task-06-rule-digests.json"
      - name: Hash canonical architecture rules again
        run: |
          bun run architecture:hash-rules -- \
            --technology=architecture/typescript-bun-baseline.v1.yaml \
            --studio=architecture/studio-host-gate.v1.yaml \
            --evidence="$RUNNER_TEMP/gorce-evidence/task-06-rule-digests-again.json"
          cmp -- "$RUNNER_TEMP/gorce-evidence/task-06-rule-digests.json" "$RUNNER_TEMP/gorce-evidence/task-06-rule-digests-again.json"
      - name: Run exact F2 fixture QA
        run: bun run qa:task -- --task=F2 --all --fixture=tests/qa/final/f2-architecture.yaml --evidence="$RUNNER_TEMP/gorce-evidence/final-architecture.json"
      - name: Run Task 6 tests
        run: bun test
      - name: Upload Task 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-6-evidence
          path: ${{ runner.temp }}/gorce-evidence
          if-no-files-found: error
