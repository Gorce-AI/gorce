openapi: 3.1.0
info:
  title: Gorce API
  version: 0.1.0
  description: Placeholder contract for the Gorce daemon API.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8787
    description: Local development server
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      $ref: '../schemas/health.schema.json'
    Error:
      $ref: '../schemas/error.schema.json'
