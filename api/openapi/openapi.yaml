openapi: 3.1.0
info:
  title: Gorce daemon API
  version: 0.1.0
  description: |
    Phase 1 exposes a read-only snapshot/event surface and one authenticated
    project command mutation boundary. The command endpoint accepts only the
    closed authority commands profile registration, operator binding, and
    admission creation. Admission accepts only operator_id and run_id.
    Phase-1 profiles and admissions have an explicit disabled execution
    disposition with zero authority and budget; no command starts execution.

    Bearer authentication is required. `Idempotency-Key` is required on every
    command request and is principal-scoped transport metadata. The daemon owns
    principal, actor, policy, profile revision, grant, pinned spec, admission
    identity, timestamps, batch identity, sequences, canonical events, and
    storage metadata. `X-Gorce-Token` is not accepted.
    Command failures use the closed CommandError codes. `invalid_command`,
    `invalid_arguments`, `missing_idempotency_key`, `command_not_supported`,
    and `command_rejected` return 400; `idempotency_conflict` returns 409;
    `commit_unavailable` returns 503. Command-route 400 responses are the
    documented `ApiError | CommandError` union: protocol-header rejection is
    an `ApiError`, while command validation failures are `CommandError`.

    EventBatch is a daemon-only canonical persisted contract. No raw EventBatch
    write endpoint exists. Public event cursors are opaque v0 values in the
    `g1-<batch-sequence>-<event-ordinal>` representation; clients must reuse
    them verbatim and must not parse or require numeric contiguity.
servers:
  - url: http://127.0.0.1:8787
tags:
  - name: system
  - name: authority
  - name: events
paths:
  /v0/meta:
    get:
      tags: [system]
      operationId: getMeta
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Meta'
        default:
          $ref: '#/components/responses/Error'
  /v0/health:
    get:
      tags: [system]
      operationId: getHealth
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Error'
  /v0/projects/{project_id}/snapshot:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [system]
      operationId: getProjectSnapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProjectSnapshot'
        default:
          $ref: '#/components/responses/Error'
  /v0/projects/{project_id}/commands:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ProtocolVersion'
    post:
      tags: [authority]
      operationId: submitProjectCommand
      summary: Submit one daemon-owned authority command
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/command-request.schema.json'
      responses:
        '201':
          $ref: '#/components/responses/CommandCommit'
        '400':
          $ref: '#/components/responses/CommandRequestError'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/CommandError'
        '503':
          $ref: '#/components/responses/CommandError'
        default:
          $ref: '#/components/responses/Error'
  /v0/projects/{project_id}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EventCursor'
    get:
      tags: [events]
      operationId: listPublicEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventLimit'
      description: |
        Read-only public events. A stale or unknown query cursor returns a
        resync-required response. POST and all other mutation methods are not
        advertised and receive HTTP 405 from the daemon router.
      responses:
        '200':
          $ref: '#/components/responses/PublicEventBatch'
        '409':
          $ref: '#/components/responses/ResyncRequired'
        default:
          $ref: '#/components/responses/Error'
  /v0/events:
    get:
      tags: [events]
      operationId: streamPublicEventsLegacy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamProjectId'
        - $ref: '#/components/parameters/EventCursor'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          $ref: '#/components/responses/PublicEventStream'
        default:
          $ref: '#/components/responses/Error'
  /v0/events/stream:
    get:
      tags: [events]
      operationId: streamPublicEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamProjectId'
        - $ref: '#/components/parameters/EventCursor'
        - $ref: '#/components/parameters/LastEventId'
      description: |
        `cursor` and `Last-Event-ID` have identical resume semantics. If both
        are supplied, the query cursor is used; otherwise Last-Event-ID is
        used. SSE public event ids are opaque cursors. The stream emits a
        `resync_required` event when retained history cannot resume the cursor.
      responses:
        '200':
          $ref: '#/components/responses/PublicEventStream'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Rotating daemon bearer token. X-Gorce-Token is rejected.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StreamProjectId:
      name: project_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Principal-scoped replay key, required for every command. It is not part of the JSON body.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ProtocolVersion:
      name: X-Gorce-Protocol-Version
      in: header
      required: false
      description: Optional protocol version precondition. An incompatible value returns ApiError.
      schema:
        type: string
    EventCursor:
      name: cursor
      in: query
      required: false
      description: Opaque g1 cursor. Reuse verbatim; do not parse or require numeric contiguity.
      schema:
        $ref: '../schemas/public-event-cursor.schema.json'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Same opaque resume cursor and semantics as the query cursor.
      schema:
        $ref: '../schemas/public-event-cursor.schema.json'
    EventLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
  responses:
    Meta:
      description: Daemon metadata
      content:
        application/json:
          schema:
            type: object
    Health:
      description: Service health
      content:
        application/json:
          schema:
            $ref: '../schemas/health.schema.json'
    Error:
      description: Typed API error
      content:
        application/json:
          schema:
            $ref: '../schemas/error.schema.json'
    CommandCommit:
      description: Durable daemon command outcome
      content:
        application/json:
          schema:
            $ref: '../schemas/command-commit.schema.json'
    CommandRequestError:
      description: Protocol/API or typed authority command error
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../schemas/error.schema.json'
              - $ref: '../schemas/command-error.schema.json'
    CommandError:
      description: Typed authority command error
      content:
        application/json:
          schema:
            $ref: '../schemas/command-error.schema.json'
    ProjectSnapshot:
      description: Durable project snapshot
      content:
        application/json:
          schema:
            type: object
    PublicEventBatch:
      description: Read-only page of public events
      content:
        application/json:
          schema:
            $ref: '../schemas/public-event-batch.schema.json'
    ResyncRequired:
      description: The requested cursor is unknown or expired.
      content:
        application/json:
          schema:
            $ref: '../schemas/error.schema.json'
          example:
            code: precondition_failed
            message: cursor is unknown or expired; resynchronization is required
            details:
              project_id: 018f0f5e-7b12-7abc-8def-0123456789ab
              requested_cursor: g1-1-0
    PublicEventStream:
      description: SSE public and resync_required events
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            event: public
            id: g1-7-0
            data: {"id":"018f0f5e-7b12-7abf-8def-0123456789ab"}

            event: resync_required
            data: {"project_id":"018f0f5e-7b12-7abc-8def-0123456789ab","requested_cursor":"g1-1-0"}
  schemas:
    CommandRequest:
      $ref: '../schemas/command-request.schema.json'
    CommandCommit:
      $ref: '../schemas/command-commit.schema.json'
    CommandError:
      $ref: '../schemas/command-error.schema.json'
    Principal:
      $ref: '../schemas/principal.schema.json'
    Policy:
      $ref: '../schemas/policy.schema.json'
    ProfileRevision:
      $ref: '../schemas/profile-revision.schema.json'
    OperatorBinding:
      $ref: '../schemas/operator-binding.schema.json'
    Admission:
      $ref: '../schemas/admission.schema.json'
    PublicEventCursor:
      $ref: '../schemas/public-event-cursor.schema.json'
    EventBatch:
      x-daemon-only: true
      $ref: '../schemas/event-batch.schema.json'
