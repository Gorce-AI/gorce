[workspace]
resolver = "2"
members = [
    "crates/gorce-protocol",
    "crates/gorce-core",
    "crates/gorce-store",
    "crates/gorce-agent",
    "crates/gorce-daemon",
    "crates/gorce-sdk",
    "crates/gorce-tui",
    "crates/gorce",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gorce-ai/gorce"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
