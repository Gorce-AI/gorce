[workspace]
resolver = "2"
members = [
    "crates/gorce-provider-abi",
    "crates/gorce-protocol",
    "crates/gorce-core",
    "crates/gorce-store",
    "crates/gorce-agent",
    "crates/gorce-daemon",
    "crates/gorce-platform-security",
    "crates/gorce-platform-security-win",
    "crates/gorce-store-writer",
    "crates/gorce-provider-runtime",
    "crates/gorce-sdk",
    "crates/gorce-tui",
    "crates/gorce",
    "providers/mock-web-search",
    "providers/claude-code",
    "providers/codex",
    "providers/provider-template",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gorce-ai/gorce"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
